plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "3.35.0"
group = 'com.rtshop'

base {
    archivesName = 'rtshop-forge-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Mojang 공식 매핑
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            // 개발 실행에서도 믹스인을 적용한다 (jar 에서는 MANIFEST 의 MixinConfigs 로)
            args '-mixin.config=rtshop.mixins.json'
        }
        client {
            // ./gradlew runClient -PrtshopClientTest : 화면을 차례로 열어 사진을 찍고 끈다 (빌드 검증용)
            if (project.hasProperty('rtshopClientTest')) {
                property 'rtshop.clienttest', 'true'
                args '--quickPlaySingleplayer', 'rtshoptest', '--width', '1280', '--height', '720'
            }
        }
        server {
            args '--nogui'
            // ./gradlew runServer -PrtshopSelfTest : 서버를 띄워 자체 점검을 돌리고 끈다 (빌드 검증용)
            if (project.hasProperty('rtshopSelfTest')) {
                property 'rtshop.selftest', 'true'
            }
        }
    }
}

repositories {
}

// 다른 모드(Epic Fight 등)의 클래스 이름만 빌려 쓰는 컴파일용 자리표시. jar 에는 들어가지 않는다.
sourceSets {
    stubs {
        java { srcDir 'src/stubs/java' }
    }
}

// 자리표시 중 일부(Cinematic Interactions 장면)는 마인크래프트 클래스를 인자로 쓴다
configurations {
    stubsCompileOnly.extendsFrom minecraft
}

dependencies {
    // 컴파일 기준 버전. 모드팩의 포지(47.4.x)와 API 호환됩니다.
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    compileOnly sourceSets.stubs.output
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'rtshop',
                'Specification-Vendor'    : 'rtshop',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'rtshop',
                'MixinConfigs'            : 'rtshop.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
