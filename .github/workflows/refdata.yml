name: refdata
on:
  push:
    branches: [tools/refdata]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refdata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        run: python3 .github/scripts/refdata.py
      - name: Upload to a private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete refdata-tmp --yes || true
          gh release create refdata-tmp refdata.tar.gz --draft --title "refdata (temporary)" --notes "temporary"
