name: build
on:
  push:
    branches: [main]
    paths-ignore:
      - 'tools/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rtshop-jar
          path: build/libs/*.jar
      - name: Server self-test
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'EOF'
          online-mode=false
          spawn-protection=0
          level-type=minecraft\:flat
          max-tick-time=-1
          view-distance=4
          EOF
          timeout 1500 ./gradlew runServer -PrtshopSelfTest --no-daemon > selftest-gradle.log 2>&1 || true
          tail -n 60 selftest-gradle.log
          echo "----- self-test result -----"
          cat run/rtshop-selftest.txt
          echo "----- price audit -----"
          cat run/config/rtshop/export/audit.txt || true
          echo "----- exported prices -----"
          cat run/config/rtshop/export/blacksmith.txt run/config/rtshop/export/food.txt run/config/rtshop/export/general.txt run/config/rtshop/export/farmer.txt || true
          grep -q "RESULT: ALL PASS" run/rtshop-selftest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            run/rtshop-selftest.txt
            run/config/rtshop
            run/logs/latest.log
            selftest-gradle.log
      - name: Client screen test
        id: clienttest
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          rm -rf run/saves/rtshoptest run/screenshots run/rtshop-clienttest.txt
          mkdir -p run/saves
          cp -r run/world run/saves/rtshoptest
          cat > run/options.txt <<'EOF'
          onboardAccessibility:false
          tutorialStep:none
          skipMultiplayerWarning:true
          joinedFirstServer:true
          pauseOnLostFocus:false
          guiScale:3
          renderDistance:2
          simulationDistance:5
          maxFps:30
          graphicsMode:0
          ao:false
          renderClouds:"false"
          narrator:0
          soundCategory_master:0.0
          lang:ko_kr
          EOF
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -PrtshopClientTest --no-daemon > clienttest-gradle.log 2>&1 || true
          grep -E "rtshop-clienttest|Exception|ERROR" clienttest-gradle.log | head -n 80 || true
          tail -n 30 clienttest-gradle.log
          echo "----- client test result -----"
          cat run/rtshop-clienttest.txt
          ls -la run/screenshots || true
          grep -q "RESULT: ALL PASS" run/rtshop-clienttest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clienttest
          path: |
            run/screenshots
            run/rtshop-clienttest.txt
            clienttest-gradle.log
      - name: Share screenshots (test branches only)
        if: always() && github.ref != 'refs/heads/main'
        run: |
          mkdir -p /tmp/shots && cp -r run/screenshots/. /tmp/shots/ 2>/dev/null || true
          cp run/rtshop-clienttest.txt /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from run ${{ github.run_id }}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          VER=$(ls build/libs/*.jar | head -n 1 | sed -E 's/.*-([0-9][0-9.]*)\.jar/\1/')
          gh release create latest build/libs/*.jar --title "RT Shop $VER" --notes "mods 폴더에 넣는 jar 파일입니다. 서버와 모든 플레이어의 클라이언트에 같은 파일을 넣어 주세요. 사용법과 변경 내용은 저장소의 README 를 참고하세요."

  integration:
    # 모드팩의 요리·농사·낚시 모드와 함께 실제 포지 서버에서 자체 점검을 돌린다 (참고용: 실패해도 빌드는 유지)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: rtshop-jar
          path: jar
      - name: Install Forge server and mods
        run: |
          mkdir -p server/mods
          curl -fsSL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.0/forge-1.20.1-47.4.0-installer.jar
          (cd server && java -jar ../installer.jar --installServer > ../installer.log 2>&1 || (tail -n 30 ../installer.log; exit 1))
          python3 .github/scripts/integration.py server/mods
          cp jar/*.jar server/mods/
          ls -la server/mods
      - name: Run self-test next to the real mods
        run: |
          cd server
          echo "eula=true" > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          spawn-protection=0
          level-type=minecraft\:flat
          max-tick-time=-1
          view-distance=4
          EOF
          echo "-Xmx4G -Drtshop.selftest=true" > user_jvm_args.txt
          timeout 1500 bash run.sh nogui > ../integration.log 2>&1 || true
          cd ..
          grep -E "rtshop|Missing or unsupported|requires|Exception in|ERROR" integration.log | head -n 150 || true
          echo "----- self-test result -----"
          cat server/rtshop-selftest.txt
          echo "----- price audit -----"
          cat server/config/rtshop/export/audit.txt || true
          echo "----- food prices -----"
          cat server/config/rtshop/export/food.txt || true
          echo "----- farmer prices -----"
          cat server/config/rtshop/export/farmer.txt || true
          grep -q "RESULT: ALL PASS" server/rtshop-selftest.txt

  inspect:
    # 테스트 가지에서만: 모드팩의 일부 모드 정보를 뽑아 ci-inspect 가지에 올린다 (강화 재료·연출 연동 설계용)
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: packcache
          key: pack-${{ hashFiles('.github/scripts/pack_files.json', '.github/scripts/pack_overrides.json') }}-v2
      - name: Download the pack's mods
        run: python3 .github/scripts/fullpack.py .github/scripts/pack_files.json packcache /tmp/mods "" .github/scripts/pack_overrides.json > /dev/null
      - name: Inspect
        env:
          SPIRAL_CALLS: '/(FloorController|FloorProgress|AbyssPlayers|AbyssEncounters|ArenaSession|AbyssCycle|AbyssParties|BossProgress|FloorSelectionScreen|AbyssPlayerLifecycle|ChallengeRewards|ChestPayout|AbyssNetwork|AbyssDimension|ForgeGameplayEvents|AbyssPlatformImpl|PersistentEntityData|AbyssBlockProtection|CommandInit)(\$[^/]*)?\.class$'
          CATACLYSM_CALLS: '/(Ignis_Entity|LLibrary_Boss_Monster|LLibrary_Monster|Animation_Monsters|AltarOfFire_Block_Entity|Altar_Of_Fire_Block|Boss_monster)\.class$'
        run: |
          python3 .github/scripts/inspect_pack.py packcache /tmp/inspect
          # Cinematic Interactions 의 공개 API 와 그 API 를 쓰는 곳
          CJ="$PWD/$(ls packcache/*.jar | grep -i "cinematic interaction" | head -1)"
          mkdir -p /tmp/cj && (cd /tmp/cj && unzip -q -o "$CJ")
          cp "$CJ" /tmp/inspect/cinematic-interactions.jar   # MIT 라이선스: 연동 코드를 컴파일할 때 씀
          cd /tmp/cj
          for c in $(find dev/dyslexic/cinematic/api -name '*.class') dev/dyslexic/cinematic/client/MenuStation.class dev/dyslexic/cinematic/client/ClientStation.class $(find dev/dyslexic/cinematic/station -name '*.class'); do
            echo "######## $c"; javap -p -c -constants "$c" 2>&1 | head -n 400
          done > /tmp/inspect/cinematic-api.txt
          grep -rl "AddonStations\|AddonScenes\|AddonMenuStation" --include=*.class . > /tmp/inspect/cinematic-users.txt || true
          for c in $(cat /tmp/inspect/cinematic-users.txt | grep -v "/api/"); do
            echo "######## $c"; javap -p -c -constants "$c" 2>&1 | grep -n -B3 -A25 "Addon" | head -n 300
          done > /tmp/inspect/cinematic-uses.txt
          # Epic Fight Nightfall 크래시 조사: Entity Culling 연동 코드와 무기 속도 계산
          NF="$PWD/../../$(true)"
          cd "$GITHUB_WORKSPACE"
          NFJ="$(ls packcache/*.jar | grep -i "nightfall" | head -1)"
          ECJ="$(ls packcache/*.jar | grep -i "entityculling" | head -1)"
          EFJ="$(ls packcache/*.jar | grep -i "epic-fight-20" | head -1)"
          mkdir -p /tmp/nf && (cd /tmp/nf && unzip -q -o "$GITHUB_WORKSPACE/$NFJ" 'com/hm/efn/util/*' 'com/hm/efn/gameasset/EFNAnimations*' 'com/hm/efn/skill/weapon_innate/*' 'com/hm/efn/entity/effect/*' 'META-INF/mods.toml' '*.mixins.json' 2>/dev/null || true)
          {
            echo "== jars: $NFJ | $ECJ | $EFJ"
            cat /tmp/nf/META-INF/mods.toml
            echo "== entityculling Cullable classes"; unzip -l "$ECJ" | grep -i "cullable\|versionless" | head -40
            echo "== entityculling packages"; unzip -l "$ECJ" | awk '{print $4}' | grep '\.class$' | sed 's#/[^/]*$##' | sort -u
            for c in com/hm/efn/util/CullableUtil.class com/hm/efn/gameasset/EFNAnimations.class com/hm/efn/skill/weapon_innate/ShortSwordInnate.class; do
              echo "######## $c"; javap -p -c -constants "/tmp/nf/$c" 2>&1 | grep -v "^\s*[0-9]*: \(aload\|astore\|iload\|istore\|dup\|pop\)" | head -n 900
            done
            echo "== grep Cullable users"; grep -rl "entityculling" /tmp/nf --include=*.class | head -40
            echo "== LinkAnimation"; mkdir -p /tmp/ef && (cd /tmp/ef && unzip -q -o "$GITHUB_WORKSPACE/$EFJ" 'yesman/epicfight/api/animation/types/LinkAnimation.class' 'yesman/epicfight/api/animation/types/StaticAnimation.class') && javap -p -constants /tmp/ef/yesman/epicfight/api/animation/types/LinkAnimation.class
          } > /tmp/inspect/nightfall.txt 2>&1
          # 스토리 보스 모드: 등록 이름(몹·아이템·블록)과 영어 이름, 구조물 파일 목록
          ls packcache > /tmp/inspect/jars.txt
          for pat in illusioner mowziesmobs aquamirae cataclysm yazz reincarn betternether dragonplus; do
            J="$(ls packcache/*.jar | grep -i "$pat" | head -1)"
            [ -z "$J" ] && continue
            {
              echo "== $J"
              unzip -l "$J" | awk '{print $4}' | grep -E "lang/en_us.json|structures?/|worldgen/|loot_tables/entities|mods.toml" | head -n 200
              unzip -p "$J" 'META-INF/mods.toml' 2>/dev/null | grep -v "^#" | head -n 60
              for f in $(unzip -l "$J" | awk '{print $4}' | grep -E "worldgen/structure_set/[^/]*json" | grep -v "/tags/" | head -n 60); do echo "---- $f"; unzip -p "$J" "$f" | head -c 1500; echo; done
              unzip -p "$J" $(unzip -l "$J" | awk '{print $4}' | grep "lang/en_us.json" | head -1) 2>/dev/null | head -c 60000
            } > "/tmp/inspect/mod-$pat.txt" 2>&1
          done
          # Integrated Dungeons and Structures / Integrated API: 바닐라 구조물을 덮어쓰거나 막는 파일
          for pat in idas integrated; do
            for J in $(ls packcache/*.jar | grep -i "$pat"); do
              {
                echo "== $J"
                unzip -p "$J" 'META-INF/mods.toml' 2>/dev/null | grep -E "modId|version|displayName" | head -n 10 || true
                echo "== data/minecraft files"
                unzip -l "$J" | awk '{print $4}' | grep -E "^data/minecraft/" | head -n 300 || true
                for f in $(unzip -l "$J" | awk '{print $4}' | grep -E "^data/minecraft/worldgen/(structure_set|structure)/.*json$" | head -n 80); do echo "---- $f"; unzip -p "$J" "$f" | head -c 2500; echo; done
                echo "== structure_set files of its own (first 40)"
                for f in $(unzip -l "$J" | awk '{print $4}' | grep -E "worldgen/structure_set/.*json$" | grep -v "^data/minecraft" | head -n 40); do echo "---- $f"; unzip -p "$J" "$f" | head -c 1200; echo; done
                echo "== config classes"
                unzip -l "$J" | awk '{print $4}' | grep -i -E "config" | head -n 40 || true
              } >> "/tmp/inspect/mod-$pat.txt" 2>&1
            done
          done
          # 바닐라 구조물(무너진 차원문·사막 피라미드 등)을 덮어쓰는 모든 jar
          {
            for J in packcache/*.jar; do
              L="$(unzip -l "$J" 2>/dev/null | awk '{print $4}' | grep -E "^data/minecraft/(worldgen/structure_set/|worldgen/structure/(ruined_portal|desert_pyramid|jungle_pyramid|mansion|ancient_city|monument|trail_ruins|pillager_outpost)|tags/worldgen/biome/has_structure/(ruined_portal|desert_pyramid))" || true)"
              [ -z "$L" ] && continue
              echo "== $J"
              echo "$L"
              for f in $(echo "$L" | grep -E "ruined_portal|desert_pyramid" | head -n 12); do echo "---- $f"; unzip -p "$J" "$f" | head -c 1800; echo; done
            done
            echo "== mixin configs mentioning structures"
            for J in packcache/*.jar; do
              for m in $(unzip -l "$J" 2>/dev/null | awk '{print $4}' | grep -E "mixins?\.json$" | head -n 5); do
                if unzip -p "$J" "$m" | grep -q -i -E "structure|portal|ChunkGenerator"; then echo "-- $J $m"; unzip -p "$J" "$m" | grep -i -E "structure|portal|ChunkGenerator" | head -n 10; fi
              done
            done
          } > /tmp/inspect/vanilla-structures.txt 2>&1
          # Fantasy Mounts: 퀘스트 설정이 어느 설정 파일(서버/공용/클라이언트)의 어떤 키인지
          J="$(ls packcache/*.jar | grep -i "fantasy" | head -1)"
          if [ -n "$J" ]; then
            {
              echo "== $J"
              unzip -p "$J" 'META-INF/mods.toml' 2>/dev/null | grep -v "^#" | head -n 30
              echo "== files with quest/config/toml/json in the name"
              unzip -l "$J" | awk '{print $4}' | grep -i -E "quest|\.toml|settings|defaults?/" | head -n 80
              for c in $(unzip -l "$J" | awk '{print $4}' | grep -i -E "(quest/|config/WorldSettings|config/FantasyConfigs|WorldFiles|SettingsSync|ConfigSchema\.class)" | grep "\.class$" | head -n 40); do
                echo "---- $c"; unzip -p "$J" "$c" | strings -n 3 | grep -v "^[(L\[]" | grep -i -E "quest|enable|toml|json|world|setting|\." | head -n 80
              done
              for f in $(unzip -l "$J" | awk '{print $4}' | grep -i -E "(\.toml|quest.*\.json|settings.*\.json)$" | head -n 10); do echo "---- $f"; unzip -p "$J" "$f" | head -c 4000; echo; done
            } > /tmp/inspect/mod-fantasy.txt 2>&1
          fi
          cd /tmp/inspect
          git init -q -b ci-inspect
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Inspect from run ${{ github.run_id }}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-inspect

  fullpack:
    # 모드팩 "RT1 - 2" 의 모드 전체(매니페스트에 적힌 버전 그대로)와 함께 포지 서버에서 자체 점검을 돌린다 (참고용: 실패해도 빌드는 유지)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 75
    env:
      # 전용 서버에서는 켜지지 않는 클라이언트 전용 모드
      SKIP_MODS: "cwb-,forgematica,mafglib,oculus"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: rtshop-jar
          path: jar
      - uses: actions/cache@v4
        with:
          path: packcache
          key: pack-${{ hashFiles('.github/scripts/pack_files.json', '.github/scripts/pack_overrides.json') }}-v2
      - name: Download the pack's mods
        run: python3 .github/scripts/fullpack.py .github/scripts/pack_files.json packcache server/mods "$SKIP_MODS" .github/scripts/pack_overrides.json
      - name: Install Forge server
        run: |
          cd server
          # 모드팩(RT1 - 2_7)의 Forge 버전
          FV=1.20.1-47.4.29
          echo "FORGE_VER=$FV" >> "$GITHUB_ENV"
          curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/$FV/forge-$FV-installer.jar"
          java -jar installer.jar --installServer > installer.log 2>&1 || (tail -n 30 installer.log; exit 1)
          cp ../jar/*.jar mods/
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\nmax-tick-time=-1\nview-distance=4\nsimulation-distance=4\n' > server.properties
          echo "-Xmx10G -Drtshop.selftest=true" > user_jvm_args.txt
      - name: Run self-test next to the whole pack
        run: |
          cd server
          bash run.sh nogui > server.log 2>&1 &
          for i in $(seq 1 90); do
            sleep 10
            if grep -q "^RESULT" rtshop-selftest.txt 2>/dev/null; then echo "self-test finished after $((i*10))s"; break; fi
            if grep -q "Failed to start the minecraft server" server.log 2>/dev/null; then echo "mod loading failed after $((i*10))s"; break; fi
            if ! pgrep -x java > /dev/null; then echo "server exited after $((i*10))s"; break; fi
          done
          sleep 20
          pkill -x java || true
          echo "----- loading errors -----"
          grep -A14 "Loading errors encountered" server.log | grep -v "^\s*at " | cut -c1-260 | head -n 24 || true
          echo "----- self-test -----"
          grep -v "^PASS" rtshop-selftest.txt | cut -c1-700 || true
          echo "checks passed: $(grep -c '^PASS' rtshop-selftest.txt 2>/dev/null)"
          echo "----- price check -----"
          grep -E "적자|자동으로 올렸|레시피 파일|해당 품목|손해|식품 상인|올린 음식" config/rtshop/export/audit.txt | cut -c1-3000 || true
          sed -n '/사서 만들어 팔 때 손해인 조리법/,/재료비 차이가 큰 음식:/p' config/rtshop/export/audit.txt | head -n 120 | cut -c1-300 || true
          grep -q "RESULT: ALL PASS" rtshop-selftest.txt
      - name: Client screen test inside the whole pack
        # 모드팩의 모든 모드(클라이언트 전용 포함)와 날개 모드를 넣은 실제 클라이언트에서 화면 점검을 돌린다
        # (서버 자체 점검이 실패해도 화면 점검은 돌린다: 한쪽 실패가 다른 쪽 결과를 가리지 않게)
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          python3 -m pip install -q "portablemc<5"
          mkdir -p client/mods client/saves
          # Chunky 는 모드팩 overrides 의 dhcompat(CI 에서는 받을 수 없음) 없이 Distant Horizons 와 함께 켜면 세계를 열 때 튕긴다 → 클라이언트 시험에서는 뺀다
          while IFS= read -r f; do case "$f" in ""|Chunky*) ;; *) cp "packcache/$f" client/mods/ ;; esac; done < packcache/client_mods.txt
          cp jar/*.jar client/mods/
          cp -r server/world client/saves/rtshoptest
          rm -f client/saves/rtshoptest/session.lock
          printf 'onboardAccessibility:false\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\npauseOnLostFocus:false\nguiScale:3\nrenderDistance:2\nsimulationDistance:5\nmaxFps:30\ngraphicsMode:0\nao:false\nnarrator:0\nsoundCategory_master:0.0\nlang:ko_kr\n' > client/options.txt
          echo "mods: $(ls client/mods | wc -l)"
          (timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" portablemc --main-dir "$PWD/mc" --work-dir "$PWD/client" start forge:$FORGE_VER -u Dev --jvm "$JAVA_HOME/bin/java" --jvm-args "-Xmx9G -Drtshop.clienttest=true" --resolution 1280x720 > client.log 2>&1) || echo "client exit code $?"
          echo "----- client result -----"
          cat client/rtshop-clienttest.txt 2>/dev/null | cut -c1-300 || echo "no client result"
          echo "----- crash reports -----"
          for f in client/crash-reports/*.txt; do [ -f "$f" ] && grep -E "^Description:|^java\.|^net\.|^Caused by|Suspected Mods|Mod File:|Failure message:|Exception message:|^\tat " "$f" | cut -c1-240 | head -n 30; done
          grep -A10 "Loading errors encountered" client/logs/latest.log 2>/dev/null | grep -v "^\s*at " | cut -c1-260 | head -n 16 || true
          grep -q "RESULT: ALL PASS" client/rtshop-clienttest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullpack-client
          path: |
            client/screenshots
            client/rtshop-clienttest.txt
            client/logs/latest.log
            client/crash-reports
          if-no-files-found: ignore
      - name: Share full-pack screenshots (test branches only)
        if: always() && github.ref != 'refs/heads/main'
        run: |
          mkdir -p /tmp/fpshots && cp -r client/screenshots/. /tmp/fpshots/ 2>/dev/null || true
          cp client/rtshop-clienttest.txt /tmp/fpshots/ 2>/dev/null || true
          cp server/config/rtshop/export/diag.txt server/config/rtshop/export/audit.txt /tmp/fpshots/ 2>/dev/null || true
          cp server/rtshop-selftest.txt /tmp/fpshots/ 2>/dev/null || true
          mkdir -p /tmp/fpshots/crash && cp client/crash-reports/*.txt /tmp/fpshots/crash/ 2>/dev/null || true
          tail -n 400 client/logs/latest.log > /tmp/fpshots/client-tail.log 2>/dev/null || true
          grep -n -A45 "server-side action failed" client/logs/latest.log | head -n 400 > /tmp/fpshots/server-action-errors.txt 2>/dev/null || true
          grep -n -B12 "rtshop-clienttest\] FAIL" client/logs/latest.log | cut -c1-400 | head -n 600 > /tmp/fpshots/fail-context.txt 2>/dev/null || true
          grep -n -B3 -A8 "Critical injection\|InjectionError\|VillagerTrades" client/logs/latest.log | head -n 200 > /tmp/fpshots/mixin-errors.txt 2>/dev/null || true
          # 어떤 모드가 주민 거래(VillagerTrades)를 Mixin 으로 고치는지
          python3 - packcache > /tmp/fpshots/villager-trade-mixins.txt <<'PY' || true
          import os, sys, zipfile
          d = sys.argv[1]
          for n in sorted(os.listdir(d)):
              if not n.endswith('.jar'):
                  continue
              try:
                  z = zipfile.ZipFile(os.path.join(d, n))
                  for e in z.namelist():
                      if e.endswith('.class') and 'mixin' in e.lower():
                          b = z.read(e)
                          if b'VillagerTrades$EmeraldsForVillagerTypeItem' in b or b'VillagerTrades$ItemsForEmeralds' in b and b'EmeraldsForVillagerType' in b:
                              print(n, e)
              except Exception as ex:
                  print('skip', n, ex)
          PY
          cd /tmp/fpshots
          git init -q -b ci-fullpack-screenshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Full-pack screenshots from run ${{ github.run_id }}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-fullpack-screenshots

