                echo "---- $c"; unzip -p "$J" "$c" | strings -n 3 | grep -v "^[(L\[]" | grep -i -E "quest|enable|toml|json|world|setting|\." | head -n 80
              done
              for f in $(unzip -l "$J" | awk '{print $4}' | grep -i -E "(\.toml|quest.*\.json|settings.*\.json)$" | head -n 10); do echo "---- $f"; unzip -p "$J" "$f" | head -c 4000; echo; done
            } > /tmp/inspect/mod-fantasy.txt 2>&1
          fi
          cd /tmp/inspect
          git init -q -b ci-inspect
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Inspect from run ${{ github.run_id }}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-inspect

  perf:
    # 3.70.0 성능 측정 (테스트 가지에서만, 참고용): 모드팩 전체로 실제 지형의 새 세계를 띄워 서버 틱 시간 · 지형 생성 속도 · 메모리,
    # 클라이언트 FPS(마을 NPC · 날아서 새 땅 · 몹 곁), Distant Horizons 의 가까운 청크 빈틈(전용 서버 접속)을 재고, JFR 로 모드별 CPU 몫을 낸다.
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 110
    env:
      SKIP_MODS: "cwb-,forgematica,mafglib,oculus"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: rtshop-jar
          path: jar
      - uses: actions/cache@v4
        with:
          path: packcache
          key: pack-${{ hashFiles('.github/scripts/pack_files.json', '.github/scripts/pack_overrides.json') }}-v2
      - name: Download the pack's mods
        run: python3 .github/scripts/fullpack.py .github/scripts/pack_files.json packcache server/mods "$SKIP_MODS" .github/scripts/pack_overrides.json
      - name: Install Forge server
        run: |
          cd server
          FV=1.20.1-47.4.29
          echo "FORGE_VER=$FV" >> "$GITHUB_ENV"
          curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/$FV/forge-$FV-installer.jar"
          java -jar installer.jar --installServer > installer.log 2>&1 || (tail -n 30 installer.log; exit 1)
          cp ../jar/*.jar mods/
          echo "eula=true" > eula.txt
          nproc; free -g | head -n 2
      - name: Server performance (real terrain)
        run: |
          cd server
          # Distant Horizons 3.3.3 + Chunky 는 모드팩의 dhcompat 없이 켜면 새 세계의 첫 청크에서 튕겼다 ("Chunky is not loaded").
          # 3.70.0 의 RT Shop 막이(DhChunkyMixin)를 시험하려고 Chunky 를 그대로 둔다 (새 세계를 만드는 이 단계가 튕기던 바로 그 경우).
          ls mods | grep -iE "^chunky|distanthorizons" || true
          printf 'online-mode=false\nspawn-protection=0\nlevel-name=perfworld\nlevel-seed=20261127\nmax-tick-time=-1\nview-distance=8\nsimulation-distance=6\ndifficulty=easy\n' > server.properties
          echo "-Xmx10G -Drtshop.perftest=true -Drtshop.perf.jfr=$PWD/perf-server.jfr -XX:StartFlightRecording=settings=profile" > user_jvm_args.txt
          START=$(date +%s)
          bash run.sh nogui > perf-server.log 2>&1 &
          for i in $(seq 1 180); do
            sleep 10
            if grep -q "^RESULT" rtshop-perf-server.txt 2>/dev/null; then echo "perf finished after $((i*10))s"; break; fi
            if ! pgrep -x java > /dev/null; then echo "server exited after $((i*10))s"; break; fi
          done
          sleep 20; pkill -x java || true; sleep 5
          echo "startup: $(grep -o 'Done ([0-9.]*s)' perf-server.log | head -n 1)"
          cat rtshop-perf-server.txt || tail -n 40 perf-server.log
          for f in crash-reports/*.txt; do [ -f "$f" ] && grep -E "^Description:|Caused by|Exception|^\tat (com|net|org|dev)\.[a-z]" "$f" | grep -v "at net.minecraft" | head -n 20; done
          { echo "== server perf (new world, Chunky + DH)"; grep -E "Chunky link deferred|Chunky is not loaded|Chunky .*(loaded|enabled)|Done \(" perf-server.log | cut -c1-260 | head -n 8; ls crash-reports 2>/dev/null; } >> ../chunky-check.txt
          cat ../chunky-check.txt
          python3 ../.github/scripts/perf_report.py perf-server.jfr mods rtshop-perf-server.txt > perf-server-report.txt 2>&1 || true
          head -n 160 perf-server-report.txt | cut -c1-400
      - name: Client performance (singleplayer, real terrain) — as the pack, lean, lean + server-side optimizers
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          python3 -m pip install -q "portablemc<5"
          mkdir -p client/mods client/saves
          # base 는 모드팩 그대로 (Chunky 포함: 싱글플레이에서도 RT Shop 의 DH · Chunky 막이를 시험), lean · opt 는 Chunky 를 뺀다
          while IFS= read -r f; do [ -n "$f" ] && cp "packcache/$f" client/mods/; done < packcache/client_mods.txt
          cp jar/*.jar client/mods/
          printf 'onboardAccessibility:false\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\npauseOnLostFocus:false\nguiScale:2\nrenderDistance:8\nsimulationDistance:6\nmaxFps:260\nenableVsync:false\ngraphicsMode:1\nao:true\nentityShadows:true\nnarrator:0\nsoundCategory_master:0.0\nlang:ko_kr\n' > client/options.txt
          echo "mods: $(ls client/mods | wc -l)"
          python3 .github/scripts/extra_mods.py extramods canary:both ai-improvements:both clumps:both || true
          run_client() {
            local name="$1"
            rm -rf client/saves/rtshoptest && cp -r server/perfworld client/saves/rtshoptest && rm -f client/saves/rtshoptest/session.lock
            rm -f client/rtshop-perf-client.txt
            (sleep 1300; pkill -9 -f "rtshop.clienttest"; pkill -9 -f Xvfb; pkill -9 -f xvfb-run) > /dev/null 2>&1 &
            local wd=$!
            (timeout -k 20 1200 xvfb-run -a -s "-screen 0 1280x720x24" portablemc --main-dir "$PWD/mc" --work-dir "$PWD/client" start forge:$FORGE_VER -u Dev --jvm "$JAVA_HOME/bin/java" --jvm-args "-Xmx9G -Drtshop.clienttest=true -Drtshop.clienttest.only=perf -Drtshop.perf.variant=$name -Drtshop.perf.jfr=$PWD/client/perf-client-$name.jfr -XX:StartFlightRecording=settings=profile" --resolution 1280x720 > client-perf-$name.log 2>&1) || echo "client exit code $?"
            pkill -9 -f "rtshop.clienttest" || true
            kill $wd 2>/dev/null || true
            cp client/rtshop-perf-client.txt client/rtshop-perf-client-$name.txt 2>/dev/null || echo "no $name result"
            cp client/logs/latest.log client/logs/perf-$name.log 2>/dev/null || true
            echo "===== $name"; cat client/rtshop-perf-client-$name.txt 2>/dev/null | cut -c1-300
            python3 .github/scripts/perf_report.py client/perf-client-$name.jfr client/mods client/rtshop-perf-client-$name.txt > perf-client-$name-report.txt 2>&1 || true
          }
          run_client base
          { echo "== client base (singleplayer, Chunky + DH)"; grep -E "Chunky link deferred|Chunky is not loaded" client/logs/perf-base.log | cut -c1-260 | head -n 4; ls client/crash-reports 2>/dev/null; } >> chunky-check.txt
          # lean: ArcaneVortex(물건이 모두 RT Shop 규칙으로 막혀 있음) · Farsight(DH 와 겹침) 빼고, Diorama 의 지도 품질을 FAST 로
          mkdir -p offclient && mv client/mods/ArcaneVortex*.jar client/mods/*arsight*.jar client/mods/Chunky*.jar offclient/ 2>/dev/null || true
          DCFG=$(find client -path '*diorama*' -name 'config.json' | head -n 1); echo "diorama config: $DCFG"; grep -o '"quality"[^,}]*' "$DCFG" 2>/dev/null || true
          [ -n "$DCFG" ] && sed -i 's/"quality": *"FANCY"/"quality": "FAST"/' "$DCFG" && grep -o '"quality"[^,}]*' "$DCFG"
          run_client lean
          # opt: lean + 서버 쪽 최적화 후보 (Canary · AI Improvements · Clumps)
          cp extramods/*.jar client/mods/ 2>/dev/null || true
          run_client opt
          rm -f $(ls extramods/*.jar 2>/dev/null | sed 's#extramods/#client/mods/#') 2>/dev/null || true
          mv offclient/* client/mods/ 2>/dev/null || true
          [ -n "$DCFG" ] && sed -i 's/"quality": *"FAST"/"quality": "FANCY"/' "$DCFG" || true
      - name: Distant Horizons near-chunk gap (dedicated server + client)
        if: always()
        run: |
          cd server
          printf 'online-mode=false\nspawn-protection=0\nlevel-name=perfworld\nlevel-seed=20261127\nmax-tick-time=-1\nview-distance=6\nsimulation-distance=6\ngamemode=creative\nforce-gamemode=true\nenforce-secure-profile=false\n' > server.properties
          echo "-Xmx8G -Drtshop.perftest=true -Drtshop.perftest.serve=true" > user_jvm_args.txt
          bash run.sh nogui > dh-server.log 2>&1 &
          for i in $(seq 1 60); do sleep 10; if grep -q "Done (" dh-server.log; then echo "server up after $((i*10))s"; break; fi; done
          cd ..
          (sleep 900; pkill -9 -f "rtshop.clienttest"; pkill -9 -f Xvfb; pkill -9 -f xvfb-run) > /dev/null 2>&1 &
          (timeout -k 20 800 xvfb-run -a -s "-screen 0 1280x720x24" portablemc --main-dir "$PWD/mc" --work-dir "$PWD/client" start forge:$FORGE_VER -u Dev -s 127.0.0.1 --jvm "$JAVA_HOME/bin/java" --jvm-args "-Xmx7G -Drtshop.clienttest=true -Drtshop.clienttest.only=dh" --resolution 1280x720 > client-dh.log 2>&1) || echo "client exit code $?"
          pkill -9 -f "rtshop.clienttest" || true
          pkill -f "sleep 900" || true
          pkill -x java || true
          cat client/rtshop-dh-client.txt client/rtshop-dh-notes.txt 2>/dev/null || (echo "no DH result"; tail -n 30 client/logs/latest.log | cut -c1-300)
          { echo "== DH test (dedicated server + client, Chunky + DH)"; grep -E "Chunky link deferred|Chunky is not loaded|Done \(" server/dh-server.log | cut -c1-260 | head -n 6; grep -E "Chunky link deferred|Chunky is not loaded" client/logs/latest.log | cut -c1-260 | head -n 4; ls server/crash-reports client/crash-reports 2>/dev/null; } >> chunky-check.txt
          cat chunky-check.txt
          grep -iE "distant ?horizons|\[DH|rtshop-dh|render distance" client/logs/latest.log | cut -c1-260 | head -n 40 || true
      - name: Share performance results (test branches only)
        if: always()
        run: |
          mkdir -p /tmp/perf
          cp server/rtshop-perf-server.txt server/perf-server-report.txt client/rtshop-perf-client-*.txt perf-client-*-report.txt client/rtshop-dh-client.txt client/rtshop-dh-notes.txt chunky-check.txt /tmp/perf/ 2>/dev/null || true
          ls extramods > /tmp/perf/extramods.txt 2>/dev/null || true
          mkdir -p /tmp/perf/crash && cp server/crash-reports/*.txt client/crash-reports/*.txt /tmp/perf/crash/ 2>/dev/null || true
          cp server/dh-server.log /tmp/perf/ 2>/dev/null || true
          cp server/perf-server.log /tmp/perf/ 2>/dev/null || true
          cp client/screenshots/16*.png client/screenshots/17*.png /tmp/perf/ 2>/dev/null || true
          for n in base lean opt; do grep -iE "rtshop-perf|exception|crash" client/logs/perf-$n.log 2>/dev/null | cut -c1-300 | head -n 80 > /tmp/perf/client-perf-$n-log.txt || true; done
          tail -n 300 client/logs/latest.log > /tmp/perf/client-dh-tail.log 2>/dev/null || true
          cd /tmp/perf
          git init -q -b ci-perf
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Performance from run ${{ github.run_id }}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-perf

  fullpack:
    # 모드팩 "RT1 - 2" 의 모드 전체(매니페스트에 적힌 버전 그대로)와 함께 포지 서버에서 자체 점검을 돌린다 (참고용: 실패해도 빌드는 유지)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 105
    env:
      # 전용 서버에서는 켜지지 않는 클라이언트 전용 모드
      SKIP_MODS: "cwb-,forgematica,mafglib,oculus"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: rtshop-jar
          path: jar
      - uses: actions/cache@v4
        with:
          path: packcache
          key: pack-${{ hashFiles('.github/scripts/pack_files.json', '.github/scripts/pack_overrides.json') }}-v2
      - name: Download the pack's mods
        run: python3 .github/scripts/fullpack.py .github/scripts/pack_files.json packcache server/mods "$SKIP_MODS" .github/scripts/pack_overrides.json
      - name: Install Forge server
        run: |
          cd server
          # 모드팩(RT1 - 2_7)의 Forge 버전
          FV=1.20.1-47.4.29
          echo "FORGE_VER=$FV" >> "$GITHUB_ENV"
          curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/$FV/forge-$FV-installer.jar"
          java -jar installer.jar --installServer > installer.log 2>&1 || (tail -n 30 installer.log; exit 1)
          cp ../jar/*.jar mods/
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\nmax-tick-time=-1\nview-distance=4\nsimulation-distance=4\n' > server.properties
          echo "-Xmx10G -Drtshop.selftest=true" > user_jvm_args.txt
      - name: Run self-test next to the whole pack
        run: |
          cd server
          bash run.sh nogui > server.log 2>&1 &
          for i in $(seq 1 90); do
            sleep 10
            if grep -q "^RESULT" rtshop-selftest.txt 2>/dev/null; then echo "self-test finished after $((i*10))s"; break; fi
            if grep -q "Failed to start the minecraft server" server.log 2>/dev/null; then echo "mod loading failed after $((i*10))s"; break; fi
            if ! pgrep -x java > /dev/null; then echo "server exited after $((i*10))s"; break; fi
          done
          sleep 20
          pkill -x java || true
          echo "----- loading errors -----"
          grep -A14 "Loading errors encountered" server.log | grep -v "^\s*at " | cut -c1-260 | head -n 24 || true
          echo "----- self-test -----"
          grep -v "^PASS" rtshop-selftest.txt | cut -c1-700 || true
          echo "checks passed: $(grep -c '^PASS' rtshop-selftest.txt 2>/dev/null)"
          echo "----- price check -----"
          grep -E "적자|자동으로 올렸|레시피 파일|해당 품목|손해|식품 상인|올린 음식" config/rtshop/export/audit.txt | cut -c1-3000 || true
          sed -n '/사서 만들어 팔 때 손해인 조리법/,/재료비 차이가 큰 음식:/p' config/rtshop/export/audit.txt | head -n 120 | cut -c1-300 || true
          grep -q "RESULT: ALL PASS" rtshop-selftest.txt
      - name: Client screen test inside the whole pack
        # 모드팩의 모든 모드(클라이언트 전용 포함)와 날개 모드를 넣은 실제 클라이언트에서 화면 점검을 돌린다
        # (서버 자체 점검이 실패해도 화면 점검은 돌린다: 한쪽 실패가 다른 쪽 결과를 가리지 않게)
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          python3 -m pip install -q "portablemc<5"
          mkdir -p client/mods client/saves
          # Chunky 는 모드팩 overrides 의 dhcompat(CI 에서는 받을 수 없음) 없이 Distant Horizons 와 함께 켜면 세계를 열 때 튕긴다 → 클라이언트 시험에서는 뺀다
          while IFS= read -r f; do case "$f" in ""|Chunky*) ;; *) cp "packcache/$f" client/mods/ ;; esac; done < packcache/client_mods.txt
          cp jar/*.jar client/mods/
          cp -r server/world client/saves/rtshoptest
          rm -f client/saves/rtshoptest/session.lock
          printf 'onboardAccessibility:false\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\npauseOnLostFocus:false\nguiScale:3\nrenderDistance:2\nsimulationDistance:5\nmaxFps:30\ngraphicsMode:0\nao:false\nnarrator:0\nsoundCategory_master:0.0\nlang:ko_kr\n' > client/options.txt
          echo "mods: $(ls client/mods | wc -l)"
          (sleep 1700; pkill -9 -f "rtshop.clienttest"; pkill -9 -f Xvfb; pkill -9 -f xvfb-run) > /dev/null 2>&1 &   # 감시: 시간 제한이 듣지 않고 멈춰 버리는 일이 있었다
          (timeout -k 20 1500 xvfb-run -a -s "-screen 0 1280x720x24" portablemc --main-dir "$PWD/mc" --work-dir "$PWD/client" start forge:$FORGE_VER -u Dev --jvm "$JAVA_HOME/bin/java" --jvm-args "-Xmx9G -Drtshop.clienttest=true" --resolution 1280x720 > client.log 2>&1) || echo "client exit code $?"
          pkill -9 -f "rtshop.clienttest" || true
          echo "----- last lines of the client log -----"
          tail -n 25 client/logs/latest.log 2>/dev/null | cut -c1-300 || tail -n 25 client.log | cut -c1-300
          echo "----- client result -----"
          cat client/rtshop-clienttest.txt 2>/dev/null | cut -c1-300 || echo "no client result"
          echo "----- crash reports -----"
          for f in client/crash-reports/*.txt; do [ -f "$f" ] && grep -E "^Description:|^java\.|^net\.|^Caused by|Suspected Mods|Mod File:|Failure message:|Exception message:|^\tat " "$f" | cut -c1-240 | head -n 30; done
          grep -A10 "Loading errors encountered" client/logs/latest.log 2>/dev/null | grep -v "^\s*at " | cut -c1-260 | head -n 16 || true
          grep -q "RESULT: ALL PASS" client/rtshop-clienttest.txt
      - name: Shader pictures (Photon from the pack, through Oculus)
        # 3.64.2: 사용자는 Photon 셰이더로 플레이한다. 화면 점검을 마친 같은 세계에서, 모드팩에 든 셰이더 팩을 Oculus 로 켜고 클라이언트를 한 번 더 띄워
        # 강화 모루의 빛 · 흔적 표시 · 룬 제단의 구슬을 찍는다 (ClientShaderTest, 결과 rtshop-shadertest*.txt, 사진 150_<팩>_*).
        # llvmpipe 는 계산 셰이더 공유 메모리가 32KB 라 Photon 의 계산 패스 하나를 끈 사본을 먼저 쓰고(.github/scripts/shaderpacks.py),
        # 그래도 셰이더가 켜지지 않으면 Complementary · BSL 순서로 찍는다 (같은 Oculus 경로). 켜진 팩이 나오면 멈춘다.
        if: always()
        run: |
          pkill -f "sleep 1700" || true   # 앞 단계의 감시(1700초 뒤 클라이언트를 끔)가 이 단계의 클라이언트를 끄지 않게
          cp client/logs/latest.log client/logs/clienttest.log 2>/dev/null || true
          if ! ls client/mods | grep -qi '^oculus'; then echo "no Oculus in the pack: skipped"; exit 0; fi
          mkdir -p client/shaderpacks client/config
          PACKS=$(python3 .github/scripts/shaderpacks.py packcache client/shaderpacks)
          if [ -z "$PACKS" ]; then echo "no shader pack in the pack: skipped"; exit 0; fi
          for PH in $PACKS; do
            L=$(echo "$PH" | tr 'A-Z' 'a-z' | sed -E 's/^(photon|complementary|bsl).*/\1/; s/[^a-z0-9].*//')
            for f in oculus.properties iris.properties; do printf 'enableShaders=true\nshaderPack=%s\nmaxShadowRenderDistance=2\ndisableUpdateMessage=true\n' "$PH" > "client/config/$f"; done
            echo "===== shader pack: $PH (pictures 15x_${L}_*)"
            rm -f client/rtshop-shadertest.txt
            (sleep 700; pkill -9 -f "rtshop.clienttest"; pkill -9 -f Xvfb; pkill -9 -f xvfb-run) > /dev/null 2>&1 &
            (timeout -k 20 650 xvfb-run -a -s "-screen 0 1280x720x24" portablemc --main-dir "$PWD/mc" --work-dir "$PWD/client" start forge:$FORGE_VER -u Dev --jvm "$JAVA_HOME/bin/java" --jvm-args "-Xmx9G -Drtshop.clienttest=true -Drtshop.clienttest.only=shader -Drtshop.shadertest.label=$L" --resolution 1280x720 > client-shader.log 2>&1) || echo "client exit code $?"
            pkill -9 -f "rtshop.clienttest" || true
            pkill -f "sleep 700" || true
            cp client/logs/latest.log "client/logs/shadertest-$L.log" 2>/dev/null || true
            cp client/rtshop-shadertest.txt "client/rtshop-shadertest-$L.txt" 2>/dev/null || true
            cat client/rtshop-shadertest.txt 2>/dev/null | cut -c1-300 || echo "no shader result"
            grep -iE "using shaderpack|ShaderCompileException|error: |failed to|pipeline" "client/logs/shadertest-$L.log" 2>/dev/null | grep -viE "debug|could not find (uniform|sampler)" | cut -c1-260 | head -n 20 || true
            if head -n 1 client/rtshop-shadertest.txt 2>/dev/null | grep -q "(shader on: on "; then echo "shader on with $PH"; break; fi
          done
          cp client/logs/clienttest.log client/logs/latest.log 2>/dev/null || true
          ls client/screenshots | grep -E '^15[0-9]_' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullpack-client
          path: |
            client/screenshots
            client/rtshop-clienttest.txt
            client/rtshop-shadertest*.txt
            client/logs/latest.log
            client/logs/shadertest-*.log
            client/crash-reports
          if-no-files-found: ignore
      - name: Share full-pack screenshots (test branches only)
        if: always() && github.ref != 'refs/heads/main'
        run: |
          mkdir -p /tmp/fpshots && cp -r client/screenshots/. /tmp/fpshots/ 2>/dev/null || true
          cp client/rtshop-clienttest.txt /tmp/fpshots/ 2>/dev/null || true
          cp client/rtshop-shadertest*.txt /tmp/fpshots/ 2>/dev/null || true
          for f in client/logs/shadertest-*.log; do [ -f "$f" ] || continue; echo "===== $f"; grep -n -iE "rtshop-clienttest|using shaderpack|ShaderCompileException|error: |cinematic" "$f" | grep -viE "could not find (uniform|sampler)|Datapack animation|Error loading class" | cut -c1-400 | head -n 100; echo "----- exceptions"; grep -n -iE "Exception|Error" "$f" | grep -viE "could not find (uniform|sampler)|Datapack animation|Error loading class|ClassNotFoundException" | cut -c1-300 | head -n 40; done > /tmp/fpshots/shader-log.txt 2>/dev/null || true
          cp server/config/rtshop/export/diag.txt server/config/rtshop/export/audit.txt server/config/rtshop/export/item_policy.txt /tmp/fpshots/ 2>/dev/null || true
          cp server/rtshop-selftest.txt /tmp/fpshots/ 2>/dev/null || true
          mkdir -p /tmp/fpshots/crash && cp client/crash-reports/*.txt /tmp/fpshots/crash/ 2>/dev/null || true
          tail -n 400 client/logs/latest.log > /tmp/fpshots/client-tail.log 2>/dev/null || true
          grep -n -A45 "server-side action failed" client/logs/latest.log | head -n 400 > /tmp/fpshots/server-action-errors.txt 2>/dev/null || true
          grep -n -B12 "rtshop-clienttest\] FAIL" client/logs/latest.log | cut -c1-400 | head -n 600 > /tmp/fpshots/fail-context.txt 2>/dev/null || true
          grep -n -B3 -A8 "Critical injection\|InjectionError\|Injection error\|VillagerTrades" client/logs/latest.log | cut -c1-600 | head -n 200 > /tmp/fpshots/mixin-errors.txt 2>/dev/null || true
          python3 "$GITHUB_WORKSPACE/.github/scripts/log_summary.py" client/logs/latest.log /tmp/fpshots/log-summary.txt || true
          grep -n -iE "avalon|item.?skin|mesh_item|efn:weapon|ruinsgreatsword|duskfire|EF renderer" client/logs/latest.log | cut -c1-500 | head -n 300 > /tmp/fpshots/avalon-log.txt 2>/dev/null || true
          # 어떤 모드가 주민 거래(VillagerTrades)를 Mixin 으로 고치는지
          python3 "$GITHUB_WORKSPACE/.github/scripts/mixin_scan.py" packcache > /tmp/fpshots/villager-trade-mixins.txt 2>&1 || true
          cd /tmp/fpshots
          git init -q -b ci-fullpack-screenshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Full-pack screenshots from run ${{ github.run_id }}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-fullpack-screenshots

