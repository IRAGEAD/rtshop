name: build
on:
  push:
    branches: [main]
    paths-ignore:
      - 'tools/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rtshop-jar
          path: build/libs/*.jar
      - name: Server self-test
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'EOF'
          online-mode=false
          spawn-protection=0
          level-type=minecraft\:flat
          max-tick-time=-1
          view-distance=4
          EOF
          timeout 1500 ./gradlew runServer -PrtshopSelfTest --no-daemon > selftest-gradle.log 2>&1 || true
          tail -n 60 selftest-gradle.log
          echo "----- self-test result -----"
          cat run/rtshop-selftest.txt
          echo "----- price audit -----"
          cat run/config/rtshop/export/audit.txt || true
          echo "----- exported prices -----"
          cat run/config/rtshop/export/blacksmith.txt run/config/rtshop/export/food.txt run/config/rtshop/export/general.txt run/config/rtshop/export/farmer.txt || true
          grep -q "RESULT: ALL PASS" run/rtshop-selftest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            run/rtshop-selftest.txt
            run/config/rtshop
            run/logs/latest.log
            selftest-gradle.log
      - name: Client screen test
        id: clienttest
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          rm -rf run/saves/rtshoptest run/screenshots run/rtshop-clienttest.txt
          mkdir -p run/saves
          cp -r run/world run/saves/rtshoptest
          cat > run/options.txt <<'EOF'
          onboardAccessibility:false
          tutorialStep:none
          skipMultiplayerWarning:true
          joinedFirstServer:true
          pauseOnLostFocus:false
          guiScale:3
          renderDistance:2
          simulationDistance:5
          maxFps:30
          graphicsMode:0
          ao:false
          renderClouds:"false"
          narrator:0
          soundCategory_master:0.0
          lang:ko_kr
          EOF
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -PrtshopClientTest --no-daemon > clienttest-gradle.log 2>&1 || true
          grep -E "rtshop-clienttest|Exception|ERROR" clienttest-gradle.log | head -n 80 || true
          tail -n 30 clienttest-gradle.log
          echo "----- client test result -----"
          cat run/rtshop-clienttest.txt
          ls -la run/screenshots || true
          grep -q "RESULT: ALL PASS" run/rtshop-clienttest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clienttest
          path: |
            run/screenshots
            run/rtshop-clienttest.txt
            clienttest-gradle.log
      - name: Share screenshots (test branches only)
        if: always() && github.ref != 'refs/heads/main'
        run: |
          mkdir -p /tmp/shots && cp -r run/screenshots/. /tmp/shots/ 2>/dev/null || true
          cp run/rtshop-clienttest.txt /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from run ${{ github.run_id }}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          VER=$(ls build/libs/*.jar | head -n 1 | sed -E 's/.*-([0-9][0-9.]*)\.jar/\1/')
          gh release create latest build/libs/*.jar --title "RT Shop $VER" --notes "mods 폴더에 넣는 jar 파일입니다. 서버와 모든 플레이어의 클라이언트에 같은 파일을 넣어 주세요. 사용법과 변경 내용은 저장소의 README 를 참고하세요."

  integration:
    # 모드팩의 요리·농사·낚시 모드와 함께 실제 포지 서버에서 자체 점검을 돌린다 (참고용: 실패해도 빌드는 유지)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: rtshop-jar
          path: jar
      - name: Install Forge server and mods
        run: |
          mkdir -p server/mods
          curl -fsSL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.0/forge-1.20.1-47.4.0-installer.jar
          (cd server && java -jar ../installer.jar --installServer > ../installer.log 2>&1 || (tail -n 30 ../installer.log; exit 1))
          python3 .github/scripts/integration.py server/mods
          cp jar/*.jar server/mods/
          ls -la server/mods
      - name: Run self-test next to the real mods
        run: |
          cd server
          echo "eula=true" > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          spawn-protection=0
          level-type=minecraft\:flat
          max-tick-time=-1
          view-distance=4
          EOF
          echo "-Xmx4G -Drtshop.selftest=true" > user_jvm_args.txt
          timeout 1500 bash run.sh nogui > ../integration.log 2>&1 || true
          cd ..
          grep -E "rtshop|Missing or unsupported|requires|Exception in|ERROR" integration.log | head -n 150 || true
          echo "----- self-test result -----"
          cat server/rtshop-selftest.txt
          echo "----- price audit -----"
          cat server/config/rtshop/export/audit.txt || true
          echo "----- food prices -----"
          cat server/config/rtshop/export/food.txt || true
          echo "----- farmer prices -----"
          cat server/config/rtshop/export/farmer.txt || true
          grep -q "RESULT: ALL PASS" server/rtshop-selftest.txt

  inspect:
    # 테스트 가지에서만: 모드팩의 일부 모드 정보를 뽑아 ci-inspect 가지에 올린다 (강화 재료·연출 연동 설계용)
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: packcache
          key: pack-${{ hashFiles('.github/scripts/pack_files.json', '.github/scripts/pack_overrides.json') }}-v2
      - name: Download the pack's mods
        run: python3 .github/scripts/fullpack.py .github/scripts/pack_files.json packcache /tmp/mods "" .github/scripts/pack_overrides.json > /dev/null
      - name: Inspect antidote items and Spell Engine
        run: bash .github/scripts/inspect_spell.sh || true
      - name: Inspect Diorama
        run: |
          mkdir -p /tmp/inspect
          # A-10: Diorama 맵에 표시를 더할 수 있는지 조사 (클래스 목록과 공개 멤버의 모양만; 코드는 올리지 않는다)
          DJ="$(ls packcache/*.jar | grep -i "diorama" | head -1)"
          if [ -n "$DJ" ]; then
            {
              echo "jar: $DJ"
              unzip -l "$DJ" | awk '{print $4}' | grep -E "\.class$" | sed 's/\.class$//' | sort > /tmp/diorama-classes.txt
              echo "classes: $(wc -l < /tmp/diorama-classes.txt)"
              echo "== mods.toml"; unzip -p "$DJ" META-INF/mods.toml | head -n 60
              echo "== packages"; sed 's#/[^/]*$##' /tmp/diorama-classes.txt | sort | uniq -c | sort -rn | head -n 80
              echo "== classes that look like an API, markers, labels, waypoints"
              grep -i -E "api|marker|waypoint|label|poi|pin|icon|overlay|layer|annotation|landmark|event" /tmp/diorama-classes.txt | head -n 300
            } > /tmp/inspect/diorama.txt 2>&1
            mkdir -p /tmp/dj && (cd /tmp/dj && unzip -q -o "$GITHUB_WORKSPACE/$DJ")
            (cd /tmp/dj && for c in $(grep -i -E "api|marker|waypoint|label|poi|pin|landmark|annotation" /tmp/diorama-classes.txt | grep -v '\$' | head -n 120); do
              echo "######## $c"; javap -p "$c.class" 2>&1 | head -n 120
            done) > /tmp/inspect/diorama-api.txt 2>&1
            cp /tmp/diorama-classes.txt /tmp/inspect/diorama-classes.txt
            # 웨이포인트 저장소의 쓰임새 (MIT 라이선스: 연동 코드를 맞추는 데 씀)
            (cd /tmp/dj && for c in dev/diorama/waypoint/WaypointStore 'dev/diorama/waypoint/WaypointStore$Folders' dev/diorama/waypoint/Waypoint 'dev/diorama/waypoint/Waypoint$Kind' dev/diorama/waypoint/Waypoints dev/diorama/waypoint/WaypointShare dev/diorama/waypoint/WaypointHud 'dev/diorama/Settings$WaypointLabels' 'dev/diorama/Settings$Beams'; do
              echo "######## $c"; javap -c -p "$c.class" 2>&1 | head -n 1500
            done) > /tmp/inspect/diorama-code.txt 2>&1
            # 설정 항목의 이름만 (세계 안의 웨이포인트 표시를 끄는 항목이 있는지 보려고)
            (cd /tmp/dj && javap -p 'dev/diorama/Settings.class' 2>&1 | head -n 400; javap -p -c 'dev/diorama/waypoint/WaypointBeams.class' 2>&1 | grep -n -A40 'static boolean has(' | head -n 80) > /tmp/inspect/diorama-settings.txt 2>&1
          fi
      - name: Inspect Diorama radar
        run: |
          mkdir -p /tmp/inspect
          # 미니맵의 몹 표시(레이더)가 어디서 몹을 고르는지 (RT Shop NPC 는 말을 걸어 본 것만 보이게 하려고)
          if [ -d /tmp/dj ]; then
            (cd /tmp/dj && for c in dev/diorama/render/Radar 'dev/diorama/render/Radar$Blip' 'dev/diorama/render/Radar$Kind' 'dev/diorama/render/Radar$Pile' dev/diorama/RadarCategories 'dev/diorama/RadarCategories$Mob'; do
              echo "######## $c"; javap -c -p "$c.class" 2>&1 | head -n 3000
            done) > /tmp/inspect/diorama-radar.txt 2>&1
            (cd /tmp/dj && javap -p dev/diorama/MinimapHud.class 2>&1 | head -n 200) >> /tmp/inspect/diorama-radar.txt 2>&1
          fi
      - name: Inspect Distant Horizons and Chunky (3.70.0)
        run: |
          mkdir -p /tmp/inspect
          # DH 3.3.3 + Chunky 를 dhcompat 없이 켜면 첫 청크에서 "Chunky is not loaded" 로 튕긴다: DH 가 Chunky 를 묶는 곳과 Chunky 가 자신을 알리는 때
          DH="$(ls packcache/*.jar | grep -i "distanthorizons" | head -n 1)"; CK="$(ls packcache/*.jar | grep -i "^packcache/chunky" | head -n 1)"
          {
            echo "DH: $DH"; echo "Chunky: $CK"
            if [ -n "$DH" ]; then rm -rf /tmp/dhj && mkdir -p /tmp/dhj && (cd /tmp/dhj && unzip -q -o "$GITHUB_WORKSPACE/$DH" 'com/seibel/distanthorizons/forge/wrappers/modAccessor/*' 'com/seibel/distanthorizons/core/wrapperInterfaces/modAccessor/*' 2>/dev/null; \
              for c in com/seibel/distanthorizons/forge/wrappers/modAccessor/ChunkyAccessor com/seibel/distanthorizons/core/wrapperInterfaces/modAccessor/AbstractChunkyAccessor; do echo "######## $c"; javap -p -c "$c.class" 2>&1 | head -n 400; done); \
              rm -rf /tmp/dha && mkdir -p /tmp/dha && (cd /tmp/dha && unzip -q -o "$GITHUB_WORKSPACE/$DH" 'com/seibel/*' 2>/dev/null; echo "== who calls tryRunFirstTimeSetup"; \
                for f in $(grep -rl --include=*.class "tryRunFirstTimeSetup" . | head -n 8); do echo "-- $f"; javap -p -c "$f" 2>&1 | grep -n -B12 -A2 "tryRunFirstTimeSetup" | grep -E "^[0-9]+[-:]  (public|private|protected|static|void)|tryRunFirstTimeSetup|invoke" | head -n 30; done); fi
            if [ -n "$CK" ]; then rm -rf /tmp/ckj && mkdir -p /tmp/ckj && (cd /tmp/ckj && unzip -q -o "$GITHUB_WORKSPACE/$CK" && echo "== classes" && find . -name "*.class" | grep -iE "provider|forge|chunky\.class" | head -n 40; \
              for c in org/popcraft/chunky/ChunkyProvider $(find . -name "ChunkyForge*.class" | sed 's#^\./##; s#\.class$##' | head -n 3); do echo "######## $c"; javap -p -c "$c.class" 2>&1 | head -n 300; done); fi
          } > /tmp/inspect/dh-chunky.txt 2>&1 || true
      - name: Inspect Arcane Vortex (3.70.0)
        run: |
          mkdir -p /tmp/inspect
          # 성능 측정에서 내장 서버 틱의 약 10% (NativeAgent.MixinHooks · AttributeGuard): 무엇을 하고 언제 불리는지, 모드가 더하는 것(날개 등)
          AV="$(ls packcache/*.jar | grep -i "arcanevortex" | head -n 1)"
          if [ -n "$AV" ]; then
            rm -rf /tmp/avj && mkdir -p /tmp/avj && (cd /tmp/avj && unzip -q -o "$GITHUB_WORKSPACE/$AV" 2>/dev/null || true)
            {
              echo "AV: $AV"; cat /tmp/avj/META-INF/MANIFEST.MF 2>/dev/null | head -n 30; grep -vE "^\s*#" /tmp/avj/META-INF/mods.toml 2>/dev/null | grep -v "^$" | head -n 40
              echo "== packages"; (cd /tmp/avj && find . -name "*.class" | sed 's#^\./##; s#/[^/]*$##' | sort | uniq -c | sort -rn | head -n 80)
              echo "== mixin configs"; (cd /tmp/avj && for f in $(ls *.json 2>/dev/null); do echo "-- $f"; head -c 4000 "$f"; echo; done)
              echo "== items (en_us)"; (cd /tmp/avj && find . -path "*lang/en_us.json" | head -n 2 | xargs -r -I{} sh -c 'grep -oE "\"(item|block|entity|effect)\.arcanevortex\.[^\"]+\": *\"[^\"]*\"" {} | head -n 300')
              for c in $(cd /tmp/avj && find . \( -name "*AttributeGuard*.class" -o -name "*MixinHooks*.class" -o -name "*NativeAgent*.class" \) | sed 's#^\./##; s#\.class$##' | head -n 12); do
                echo "######## $c"; (cd /tmp/avj && javap -p -c "$c.class" 2>&1 | head -n 900)
              done
            } > /tmp/inspect/arcanevortex.txt 2>&1 || true
          fi
      - name: Inspect Diorama waypoint icons
        run: |
          mkdir -p /tmp/inspect
          # K-1 (3.69.0): 큰 지도에서 NPC 웨이포인트를 이름 대신 아이콘으로 — 웨이포인트 아이콘을 어디서 읽고 어떻게 그리는지
          if [ -d /tmp/dj ]; then
            (cd /tmp/dj && for c in dev/diorama/render/WaypointIcons dev/diorama/render/Pins dev/diorama/waypoint/WaypointOverlay 'dev/diorama/waypoint/WaypointOverlay$Pin' 'dev/diorama/Settings$WaypointLabels'; do
              echo "######## $c"; javap -c -p "$c.class" 2>&1 | head -n 2500
            done) > /tmp/inspect/diorama-icons.txt 2>&1
            (cd /tmp/dj && echo "######## MapScreen (waypoint parts)"; javap -c -p dev/diorama/MapScreen.class 2>&1 | grep -n -B3 -A3 -i "waypoint\|Pins\|label" | head -n 1500) >> /tmp/inspect/diorama-icons.txt 2>&1
            (cd /tmp/dj && echo "######## waypoint icon files"; find . -path "*waypoint*" -name "*.png" | head -n 200; find . -ipath "*icon*" -name "*.png" | head -n 200) >> /tmp/inspect/diorama-icons.txt 2>&1
          fi
      - name: Inspect Cinematic Cataclysm
        run: |
          mkdir -p /tmp/inspect
          # 보스 컷신 모드: 컷신 엔티티가 무엇을 하고(카메라·보스 소환), 어디서 불리는지, 글(언어 파일)은 무엇인지 — 기억의 문 안에서 그 컷신을 틀려고
          CC="$(ls packcache/*.jar /tmp/mods/*.jar 2>/dev/null | grep -i "cinematic.\?cataclysm" | head -1)"
          ls packcache | grep -i "cinem\|catac" > /tmp/inspect/cincat-where.txt 2>&1 || true
          ls /tmp/mods | grep -i "cinem\|catac" >> /tmp/inspect/cincat-where.txt 2>&1 || true
          case "$CC" in /*) ;; ?*) CC="$GITHUB_WORKSPACE/$CC" ;; esac
          if [ -n "$CC" ]; then
            mkdir -p /tmp/ccj && (cd /tmp/ccj && unzip -q -o "$CC")
            {
              echo "######## files"; (cd /tmp/ccj && find . -type f | grep -v "\.png$\|\.ogg$" | sort | head -n 400)
              echo "######## sizes"; (cd /tmp/ccj && find . -name '*.ogg' -o -name '*.png' | wc -l)
              echo "######## mods.toml"; cat /tmp/ccj/META-INF/mods.toml 2>/dev/null | head -n 60
              for f in $(cd /tmp/ccj && find assets -path '*lang*' -name '*.json'); do echo "######## $f"; cat "/tmp/ccj/$f"; echo; done
              for f in $(cd /tmp/ccj && find assets -name 'sounds.json'); do echo "######## $f"; head -c 3000 "/tmp/ccj/$f"; echo; done
              for f in $(cd /tmp/ccj && find data -name '*.json' | head -n 40); do echo "######## $f"; head -c 1200 "/tmp/ccj/$f"; echo; done
            } > /tmp/inspect/cincat-files.txt 2>&1
            (cd /tmp/ccj && for c in $(find . -name '*.class' | sort); do echo "######## $c"; javap -p "$c" 2>&1 | head -n 120; done) > /tmp/inspect/cincat-sigs.txt 2>&1
            (cd /tmp/ccj && for c in $(find . -name '*.class' | grep -v '\$[0-9]' | sort); do echo "######## $c"; javap -p -c "$c" 2>&1 | head -n 900; done) > /tmp/inspect/cincat-code.txt 2>&1
          fi
      - name: Inspect cooking recipes
        run: |
          mkdir -p /tmp/inspect
          # Kaleidoscope Cookery 의 조리법 두 종류(pot / flex_pot)가 어떻게 다른지 (C-6: 요리 이익 구멍)
          KJ="$(ls packcache/*.jar | grep -i "kaleidoscope" | grep -i "cook" | head -1)"
          if [ -n "$KJ" ]; then
            {
              echo "jar: $KJ"
              unzip -l "$KJ" | awk '{print $4}' | grep -E "^data/kaleidoscope_cookery/recipes/" | sed 's#/[^/]*$##' | sort | uniq -c
              for f in pot/braised_beef flex_pot/braised_beef stockpot/beef_noodle flex_stockpot/beef_noodle pot/fondant_pie flex_pot/fondant_pie pot/candied_potato flex_pot/candied_potato; do
                echo "######## $f"; unzip -p "$KJ" "data/kaleidoscope_cookery/recipes/$f.json" 2>&1 | head -c 2500; echo
              done
              echo "######## classes with Flex in the name"; unzip -l "$KJ" | awk '{print $4}' | grep -i "flex" | head -n 40
            } > /tmp/inspect/kc-recipes.txt 2>&1
            mkdir -p /tmp/kj && (cd /tmp/kj && unzip -q -o "$PWD/../../$KJ" 2>/dev/null || unzip -q -o "$GITHUB_WORKSPACE/$KJ")
            # flex 조리법을 쓰는 곳 (냄비·육수 냄비의 블록 엔티티): 넣은 재료 수에 따라 결과 개수가 어떻게 정해지는지
            # 음식 품질: flex 조리법으로 만든 음식에 붙는 품질이 어떻게 정해지고 어디에 적히는지
            (cd /tmp/kj && for c in $(find . -path '*item/quality*' -name '*.class' | head -n 12); do echo "######## $c"; javap -p -c "$c" 2>&1 | head -n 700; done) > /tmp/inspect/kc-flex-code.txt 2>&1 || true
            (cd /tmp/kj && ls data/kaleidoscope_cookery 2>/dev/null; find data -ipath '*quality*' | head -n 40; for f in $(find data -ipath '*quality*' -name '*.json' | head -n 6); do echo "######## $f"; head -c 1500 "$f"; echo; done; grep -h -i "quality" assets/kaleidoscope_cookery/lang/en_us.json | head -n 40) > /tmp/inspect/kc-quality.txt 2>&1 || true
          fi
      - name: Inspect recipes for the price check
        run: |
          mkdir -p /tmp/inspect
          python3 .github/scripts/inspect_recipes.py packcache "kaleidoscope_tavern:shaker,kaleidoscope_cookery:teapot,kaleidoscope_cookery:oil_pot,kaleidoscope_cookery:enamel_basin,better_farming_plus:sprinkler,minecraft:bucket,minecraft:water_bucket,minecraft:milk_bucket,minecraft:cake,farmersdelight:cake_slice,kaleidoscope_tavern:rum,kaleidoscope_cookery:sticky_candy" > /tmp/inspect/price-recipes.txt 2>&1 || true
      - name: Inspect
        env:
          SPIRAL_CALLS: '/(FloorController|FloorProgress|AbyssPlayers|AbyssEncounters|ArenaSession|AbyssCycle|AbyssParties|BossProgress|FloorSelectionScreen|AbyssPlayerLifecycle|ChallengeRewards|ChestPayout|AbyssNetwork|AbyssDimension|ForgeGameplayEvents|AbyssPlatformImpl|PersistentEntityData|AbyssBlockProtection|CommandInit)(\$[^/]*)?\.class$'
          CATACLYSM_CALLS: '/(Ignis_Entity|LLibrary_Boss_Monster|LLibrary_Monster|Animation_Monsters|AltarOfFire_Block_Entity|Altar_Of_Fire_Block|Boss_monster)\.class$'
        run: |
          python3 .github/scripts/inspect_pack.py packcache /tmp/inspect
          # Cinematic Interactions 의 공개 API 와 그 API 를 쓰는 곳
          CJ="$PWD/$(ls packcache/*.jar | grep -i "cinematic interaction" | head -1)"
          mkdir -p /tmp/cj && (cd /tmp/cj && unzip -q -o "$CJ")
          cp "$CJ" /tmp/inspect/cinematic-interactions.jar   # MIT 라이선스: 연동 코드를 컴파일할 때 씀
          cd /tmp/cj
          for c in $(find dev/dyslexic/cinematic/api -name '*.class') dev/dyslexic/cinematic/client/MenuStation.class dev/dyslexic/cinematic/client/ClientStation.class $(find dev/dyslexic/cinematic/station -name '*.class'); do
            echo "######## $c"; javap -p -c -constants "$c" 2>&1 | head -n 400
          done > /tmp/inspect/cinematic-api.txt
          grep -rl "AddonStations\|AddonScenes\|AddonMenuStation" --include=*.class . > /tmp/inspect/cinematic-users.txt || true
          for c in $(cat /tmp/inspect/cinematic-users.txt | grep -v "/api/"); do
