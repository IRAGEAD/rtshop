name: fullpack

on:
  push:
    branches: [ci-fullpack]

permissions:
  contents: write

env:
  # client-only mods that cannot start on a dedicated server (found by running this job)
  SKIP_MODS: "cwb-,forgematica,mafglib,oculus"

jobs:
  fullpack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon -q
      - uses: actions/cache@v4
        with:
          path: packcache
          key: pack-${{ hashFiles('.github/scripts/pack_files.json') }}-v1
      - name: Download the pack's mods
        run: python3 .github/scripts/fullpack.py .github/scripts/pack_files.json packcache server/mods "$SKIP_MODS"
      - name: Install Forge server
        run: |
          cd server
          for v in 47.4.28 47.4.10 47.4.0; do
            if curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-$v/forge-1.20.1-$v-installer.jar"; then echo "forge $v"; break; fi
          done
          java -jar installer.jar --installServer > installer.log 2>&1 || (tail -30 installer.log; exit 1)
          cp ../build/libs/*.jar mods/
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\nmax-tick-time=-1\nview-distance=4\nsimulation-distance=4\n' > server.properties
          echo "-Xmx10G -Drtshop.selftest=true" > user_jvm_args.txt
      - name: Run the server with the whole pack
        run: |
          cd server
          bash run.sh nogui > server.log 2>&1 &
          for i in $(seq 1 84); do
            sleep 10
            if grep -q "^RESULT" rtshop-selftest.txt 2>/dev/null; then echo "self-test finished after $((i*10))s"; break; fi
            if grep -q "Failed to start the minecraft server" server.log 2>/dev/null; then echo "mod loading failed after $((i*10))s"; break; fi
            if ! pgrep -x java > /dev/null; then echo "server exited after $((i*10))s"; break; fi
          done
          sleep 20
          PID=$(pgrep -x java | head -1 || true)
          if [ -n "$PID" ]; then
            if ! grep -q "Failed to start the minecraft server" server.log && ! grep -q "^RESULT" rtshop-selftest.txt 2>/dev/null; then
              echo "==== server still running (pid $PID): where is the server thread?"
              jstack "$PID" > threads.txt 2>/dev/null || true
              grep -A45 '"Server thread"' threads.txt | cut -c1-220 || true
              echo "==== main thread"
              grep -A14 '^"main"' threads.txt | cut -c1-220 || true
            fi
            kill "$PID" || true
            sleep 15
            kill -9 "$PID" 2>/dev/null || true
          fi
          echo "==== result"
          grep -E "^(FAIL|RESULT)" rtshop-selftest.txt | cut -c1-700 || echo "no self-test result"
          echo "==== checks: $(grep -c '^PASS' rtshop-selftest.txt 2>/dev/null) pass"
          echo "==== info"
          grep -E "^      " rtshop-selftest.txt | cut -c1-700 | head -30 || true
          echo "==== crash reports"
          for f in crash-reports/*.txt; do [ -f "$f" ] && grep -E "^Description:|Mod File:|Failure message:|Exception message:|^Caused by|^\tat com\.rtshop|^java\.|^net\." "$f" | cut -c1-260 | head -24; done
          echo "==== loading errors"
          grep -A14 "Loading errors encountered" server.log | grep -v "^\s*at " | cut -c1-260 | head -24 || true
          grep -c "client-side-only mods" server.log || true
          echo "==== rtshop warnings and errors"
          grep -E "WARN|ERROR" server.log | grep -i "rtshop" | grep -v -E "mods folder locator|is missing mods.toml|JarSelector|fml.toml" | cut -c1-400 | head -30 || true
          echo "==== last log lines"
          grep -v "^\s*at \|^\t\t" server.log | tail -8 | cut -c1-260
      - name: Client with the whole pack and Distant Horizons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          python3 -m pip install -q "portablemc<5"
          mkdir -p client/mods client/saves
          cp packcache/*.jar client/mods/
          cp build/libs/*.jar client/mods/
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          q = urllib.parse.urlencode({'loaders': '["forge"]', 'game_versions': '["1.20.1"]'})
          req = urllib.request.Request('https://api.modrinth.com/v2/project/distanthorizons/version?' + q, headers={'User-Agent': 'rtshop-ci (github.com/IRAGEAD/rtshop)'})
          versions = json.load(urllib.request.urlopen(req, timeout=60))
          pick = next((v for v in versions if v.get('version_type') == 'release'), versions[0])
          f = next((x for x in pick['files'] if x.get('primary')), pick['files'][0])
          print('Distant Horizons', pick['version_number'], f['filename'])
          urllib.request.urlretrieve(f['url'], 'client/mods/' + f['filename'])
          # the pack's wings mod is not on CurseForge: take it from Modrinth
          try:
              hits = json.load(urllib.request.urlopen(urllib.request.Request('https://api.modrinth.com/v2/search?' + urllib.parse.urlencode({'query': 'Arcane Vortex'}), headers={'User-Agent': 'rtshop-ci (github.com/IRAGEAD/rtshop)'}), timeout=60))['hits']
              hit = next(h for h in hits if h['title'].strip().lower() == 'arcane vortex')
              req = urllib.request.Request('https://api.modrinth.com/v2/project/' + hit['project_id'] + '/version?' + q, headers={'User-Agent': 'rtshop-ci (github.com/IRAGEAD/rtshop)'})
              versions = json.load(urllib.request.urlopen(req, timeout=60))
              pick = next((v for v in versions if '0.7.10' in v['version_number'] or any('0.7.10' in x['filename'] for x in v['files'])), versions[0])
              f = next((x for x in pick['files'] if x.get('primary')), pick['files'][0])
              print('Arcane Vortex', pick['version_number'], f['filename'], 'available:', [v['version_number'] for v in versions][:8])
              urllib.request.urlretrieve(f['url'], 'client/mods/' + f['filename'].replace(' ', '_'))
          except Exception as ex:
              print('Arcane Vortex not downloaded:', ex)
          PY
          # Distant Horizons 3.3.3 crashes on world load when Chunky is installed ("Chunky is not loaded."): test without Chunky
          rm -f client/mods/Chunky-*.jar
          # the recommended set-up also adds "Better chunk loading" (CurseForge project 899487, file 6210180)
          curl -fsSL -A "rtshop-ci (github.com/IRAGEAD/rtshop)" -o client/mods/betterchunkloading-1.20.1-5.4.jar "https://www.curseforge.com/api/v1/mods/899487/files/6210180/download" && ls -la client/mods/betterchunkloading-1.20.1-5.4.jar | cut -c1-120 || echo "Better chunk loading not downloaded"
          cp -r server/world client/saves/rtshoptest
          rm -f client/saves/rtshoptest/session.lock
          cat > client/options.txt <<'EOF'
          onboardAccessibility:false
          tutorialStep:none
          skipMultiplayerWarning:true
          joinedFirstServer:true
          pauseOnLostFocus:false
          guiScale:3
          renderDistance:2
          simulationDistance:5
          maxFps:30
          graphicsMode:0
          ao:false
          renderClouds:"false"
          narrator:0
          soundCategory_master:0.0
          lang:ko_kr
          EOF
          ls client/mods | wc -l
          (timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" portablemc --main-dir "$PWD/mc" --work-dir "$PWD/client" start forge:1.20.1-47.4.28 -u Dev --jvm "$JAVA_HOME/bin/java" --jvm-args "-Xmx9G -Drtshop.clienttest=true" --resolution 1280x720 > client.log 2>&1) || echo "client exit code $?"
          echo "==== client result"
          grep -E "^(FAIL|RESULT)" client/rtshop-clienttest.txt 2>/dev/null | cut -c1-300 || echo "no client result"
          grep -E "Arcane Vortex|Distant Horizons [0-9]" client.log dl.log 2>/dev/null | head -n 4 || true
          echo "==== Distant Horizons log lines"
          grep -h -i -E "distant ?horizons|DistantHorizons|\[DH" client/logs/latest.log 2>/dev/null | grep -i -E "error|warn|incompat|fail|exception|version|chunky|wwoo|oculus|farsight" | cut -c1-300 | awk '!seen[substr($0,12)]++' | head -n 30 || true
          ls client/hs_err*.log 2>/dev/null || true
          echo "==== Better chunk loading log lines"
          grep -h -i "betterchunkloading\|better chunk" client/logs/latest.log 2>/dev/null | grep -v "^\s*at \|\.jar  " | cut -c1-240 | awk '!seen[substr($0,12)]++' | head -n 8 || true
          echo "==== client-test log lines"
          grep -h "rtshop-clienttest" client/logs/latest.log 2>/dev/null | grep -v "PASS" | cut -c1-260 | tail -n 12 || true
          echo "==== crash reports"
          ls client/crash-reports 2>/dev/null || true
          for f in client/crash-reports/*.txt; do [ -f "$f" ] && grep -E "^Description:|^java\.|^net\.|^Caused by|Suspected Mods|Mod File:|Failure message:|Exception message:|^\tat " "$f" | cut -c1-240 | head -n 30; done
          echo "==== loading errors"
          grep -A10 "Loading errors encountered\|Missing or unsupported mandatory dependencies" client/logs/latest.log 2>/dev/null | grep -v "^\s*at " | cut -c1-260 | head -n 16 || true
          echo "==== game log (tail)"
          grep -v "^\s*at \|^\t\t" client/logs/latest.log 2>/dev/null | tail -n 6 | cut -c1-260 || true
      - name: Publish client screenshots to a branch
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/shots && cp -r client/screenshots/. /tmp/shots/ 2>/dev/null || true
          cp client/rtshop-clienttest.txt /tmp/shots/ 2>/dev/null || true
          cp client/logs/latest.log /tmp/shots/client-latest.log 2>/dev/null || true
          cp client.log /tmp/shots/launcher.log 2>/dev/null || true
          cp client/crash-reports/*.txt /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Full-pack client run ${{ github.run_id }}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
      - name: Price report
        if: always()
        run: |
          grep -E "적자|자동으로 올렸|레시피 파일|해당 품목" server/config/rtshop/export/audit.txt | cut -c1-300 | head -n 6 || true
