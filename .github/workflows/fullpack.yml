name: fullpack

on:
  push:
    branches: [ci-fullpack]

permissions:
  contents: read

env:
  # client-only mods that cannot start on a dedicated server (found by running this job)
  SKIP_MODS: "cwb-,forgematica,mafglib,oculus"

jobs:
  fullpack:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon -q
      - uses: actions/cache@v4
        with:
          path: packcache
          key: pack-${{ hashFiles('.github/scripts/pack_files.json') }}-v1
      - name: Download the pack's mods
        run: python3 .github/scripts/fullpack.py .github/scripts/pack_files.json packcache server/mods "$SKIP_MODS"
      - name: Install Forge server
        run: |
          cd server
          for v in 47.4.28 47.4.10 47.4.0; do
            if curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-$v/forge-1.20.1-$v-installer.jar"; then echo "forge $v"; break; fi
          done
          java -jar installer.jar --installServer > installer.log 2>&1 || (tail -30 installer.log; exit 1)
          cp ../build/libs/*.jar mods/
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\nmax-tick-time=-1\nview-distance=4\nsimulation-distance=4\n' > server.properties
          echo "-Xmx10G -Drtshop.selftest=true" > user_jvm_args.txt
      - name: Run the server with the whole pack
        run: |
          cd server
          bash run.sh nogui > server.log 2>&1 &
          for i in $(seq 1 84); do
            sleep 10
            if grep -q "^RESULT" rtshop-selftest.txt 2>/dev/null; then echo "self-test finished after $((i*10))s"; break; fi
            if grep -q "Failed to start the minecraft server" server.log 2>/dev/null; then echo "mod loading failed after $((i*10))s"; break; fi
            if ! pgrep -x java > /dev/null; then echo "server exited after $((i*10))s"; break; fi
          done
          sleep 20
          PID=$(pgrep -x java | head -1 || true)
          if [ -n "$PID" ]; then
            if ! grep -q "Failed to start the minecraft server" server.log && ! grep -q "^RESULT" rtshop-selftest.txt 2>/dev/null; then
              echo "==== server still running (pid $PID): where is the server thread?"
              jstack "$PID" > threads.txt 2>/dev/null || true
              grep -A45 '"Server thread"' threads.txt | cut -c1-220 || true
              echo "==== main thread"
              grep -A14 '^"main"' threads.txt | cut -c1-220 || true
            fi
            kill "$PID" || true
            sleep 15
            kill -9 "$PID" 2>/dev/null || true
          fi
          echo "==== result"
          grep -E "^(FAIL|RESULT)" rtshop-selftest.txt | cut -c1-700 || echo "no self-test result"
          echo "==== checks: $(grep -c '^PASS' rtshop-selftest.txt 2>/dev/null) pass"
          echo "==== info"
          grep -E "^      " rtshop-selftest.txt | cut -c1-700 | head -30 || true
          echo "==== crash reports"
          for f in crash-reports/*.txt; do [ -f "$f" ] && grep -E "^Description:|Mod File:|Failure message:|Exception message:|^Caused by|^\tat com\.rtshop|^java\.|^net\." "$f" | cut -c1-260 | head -24; done
          echo "==== loading errors"
          grep -A14 "Loading errors encountered" server.log | grep -v "^\s*at " | cut -c1-260 | head -24 || true
          grep -c "client-side-only mods" server.log || true
          echo "==== rtshop warnings and errors"
          grep -E "WARN|ERROR" server.log | grep -i "rtshop" | grep -v -E "mods folder locator|is missing mods.toml|JarSelector|fml.toml" | cut -c1-400 | head -30 || true
          echo "==== last log lines"
          grep -v "^\s*at \|^\t\t" server.log | tail -8 | cut -c1-260
      - name: Price report
        if: always()
        run: |
          cd server/config/rtshop/export
          grep -E "적자|자동으로 올렸|가격표에 없던|레시피 파일" audit.txt | cut -c1-600 | head -12 || true
          echo "==== cheaper to make than to buy"
          grep -B8 "해당 품목" audit.txt | cut -c1-200 | head -12 || true
          echo "==== entries per mod (blacksmith)"
          grep -E "^[a-z0-9_]+:" blacksmith.txt | cut -d: -f1 | sort | uniq -c | sort -rn | tr '\n' ';' | cut -c1-1500; echo
          echo "==== entries per mod (food)"
          grep -E "^[a-z0-9_]+:" food.txt | cut -d: -f1 | sort | uniq -c | sort -rn | tr '\n' ';' | cut -c1-800; echo
          echo "==== entries per mod (farmer)"
          grep -E "^[a-z0-9_]+:" farmer.txt | cut -d: -f1 | sort | uniq -c | sort -rn | tr '\n' ';' | cut -c1-800; echo
          echo "==== header + 25 most expensive blacksmith goods"
          head -6 blacksmith.txt | cut -c1-200
          grep -E "^[a-z0-9_]+:" blacksmith.txt | sort -t'|' -k2 -n -r | head -25 | cut -c1-150
          echo "==== cataclysm / irons_spellbooks / arsenal samples"
          grep -E "^(cataclysm|irons_spellbooks|arsenal|jewelry|epicfight|wom):" blacksmith.txt | sort -t'|' -k2 -n -r | awk -F: '{c[$1]++; if (c[$1]<=6) print}' | cut -c1-150
          echo "==== estimated ingredients (first 60)"
          sed -n '/추정가를 쓴 재료/,$p' audit.txt | head -62 | cut -c1-120 | tr '\n' ';' | cut -c1-3500; echo
